    <title>KCAL Tracker</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0a0e1a;--bg-grad:linear-gradient(180deg,#0a0e1a,#0f1729);
            --card:#141b2e;--card-hover:#1a2238;--card2:#1f2940;
            --text:#f1f5f9;--text-dim:#94a3b8;--text-faint:#64748b;
            --border:#1f2940;--border-strong:#334155;
            --accent:#3b82f6;--accent2:#06b6d4;--accent-glow:rgba(59,130,246,.3);
            --cal:#ef4444;--weight:#10b981;--maint:#f59e0b;--avg:#f97316;--trend:#8b5cf6;
            --danger:#ef4444;--success:#22c55e;
            --protein:#3b82f6;--fat:#f59e0b;--carb:#22c55e;
            --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-lg:0 10px 40px rgba(0,0,0,.4)
        }
        body.theme-light{
            --bg:#f8fafc;--bg-grad:linear-gradient(180deg,#f8fafc,#eef2f7);
            --card:#fff;--card-hover:#f8fafc;--card2:#f1f5f9;
            --text:#0f172a;--text-dim:#475569;--text-faint:#94a3b8;
            --border:#e2e8f0;--border-strong:#cbd5e1;
            --accent-glow:rgba(59,130,246,.15);
            --shadow:0 2px 12px rgba(15,23,42,.06);--shadow-lg:0 8px 32px rgba(15,23,42,.1)
        }
        html,body{height:100%;overscroll-behavior:none}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;background:var(--bg-grad);background-attachment:fixed;color:var(--text);min-height:100vh;transition:background .4s,color .4s;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom)+24px) env(safe-area-inset-left);-webkit-font-smoothing:antialiased}
        .container{max-width:880px;margin:0 auto;padding:16px}
        .header{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;padding:18px 20px 16px;background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:24px;z-index:50;backdrop-filter:blur(12px)}
        .header-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
        .header h1{font-size:24px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header-buttons{display:flex;gap:10px;justify-content:flex-end}
        .icon-btn{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;min-height:48px;min-width:52px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
        .icon-btn:hover,.icon-btn:active{background:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
        .icon-btn.danger:hover{background:var(--danger)}
        .icon-btn.sm{padding:6px 10px;font-size:12px;min-height:32px;min-width:36px;border-radius:8px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
        .card-title{font-size:11px;font-weight:700;margin-bottom:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
        .input-row{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
        @media(min-width:600px){.input-row{grid-template-columns:1fr 1fr 1fr}}
        .input-group label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
        input,select,textarea{width:100%;padding:14px 16px;background:var(--card2);color:var(--text);border:1.5px solid var(--border);border-radius:12px;font-size:16px;transition:all .2s;font-family:inherit;-webkit-appearance:none;appearance:none}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
        input::placeholder{color:var(--text-faint)}
        input[type="date"]{min-height:50px}
        .input-with-btn{display:flex;gap:8px}
        .input-with-btn input{flex:1;margin:0}
        .input-with-btn .icon-btn{min-width:52px;font-size:16px}
        .suggestion-box{margin-top:10px;padding:14px;background:var(--card2);border-left:3px solid var(--success);border-radius:12px;font-size:14px;animation:slideIn .2s ease-out}
        @keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        .suggestion-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .suggestion-info .name{font-weight:700}
        .suggestion-info .cal{color:var(--success);font-weight:700;font-size:16px}
        .suggestion-info .serving{font-size:12px;color:var(--text-dim)}
        .suggestion-row{display:flex;gap:8px;margin-bottom:10px}
        .suggestion-row button{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;min-height:44px;transition:all .15s}
        .btn-accept{background:var(--success);color:#fff}
        .btn-accept:hover{background:#16a34a}
        .btn-decline{background:var(--card);color:var(--text);border:1.5px solid var(--border)!important}
        .btn-decline:hover{background:var(--card-hover)}
        .override-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
        .override-row input{padding:10px 14px;font-size:14px;min-height:44px}
        .override-row.three{grid-template-columns:1fr 1fr 1fr}
        .macro-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
        .macro-input{position:relative}
        .macro-input label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
        .macro-input.protein label{color:var(--protein)}
        .macro-input.fat label{color:var(--fat)}
        .macro-input.carb label{color:var(--carb)}
        .macro-input input{padding:10px 12px;font-size:14px}
        .macro-exclude{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-dim);cursor:pointer}
        .macro-exclude input{width:auto;margin:0}
        .macro-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;cursor:pointer;margin-bottom:10px}
        .macro-toggle input{width:auto;margin:0}
        .battery-card{padding:22px 20px}
        .battery-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
        .battery-header .date{font-size:13px;color:var(--text-dim);font-weight:600}
        .battery{display:flex;align-items:center;gap:16px}
        .battery-bar{flex:1;height:42px;background:var(--card2);border-radius:12px;overflow:hidden;position:relative;border:1.5px solid var(--border-strong)}
        .battery-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:10px;box-shadow:0 0 12px var(--accent-glow)}
        .battery-fill.over{background:linear-gradient(90deg,var(--cal),var(--maint));box-shadow:0 0 12px rgba(239,68,68,.4)}
        .battery-stats{text-align:right;min-width:110px}
        .battery-stats .total{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
        .battery-stats .max{font-size:13px;color:var(--text-dim);margin-top:2px}
        .battery-stats .remaining{font-size:12px;color:var(--success);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
        .battery-stats .remaining.over{color:var(--cal)}
        .target-line{position:absolute;top:0;bottom:0;width:2px;border-left:2px dashed var(--text-dim);z-index:2}
        .mini-bars{margin-top:12px;display:flex;flex-direction:column;gap:8px}
        .mini-bar-row{display:flex;align-items:center;gap:10px}
        .mini-bar-label{font-size:11px;font-weight:700;text-transform:uppercase;min-width:18px}
        .mini-bar-label.p{color:var(--protein)}
        .mini-bar-label.f{color:var(--fat)}
        .mini-bar-label.c{color:var(--carb)}
        .mini-bar-track{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden;border:1px solid var(--border)}
        .mini-bar-fill{height:100%;border-radius:6px;transition:width .4s ease}
        .mini-bar-fill.p{background:var(--protein)}
        .mini-bar-fill.f{background:var(--fat)}
        .mini-bar-fill.c{background:var(--carb)}
        .mini-bar-nums{font-size:12px;font-weight:600;min-width:70px;text-align:right;color:var(--text-dim)}
        .chart-wrap{position:relative;height:380px;margin-top:8px}
        @media(max-width:600px){.chart-wrap{height:340px}}
        .chart-fullscreen{position:fixed;inset:0;z-index:200;background:var(--bg);padding:20px;display:flex;flex-direction:column}
        .chart-fullscreen .chart-wrap{flex:1;height:auto}
        .chart-fullscreen .fs-close{position:absolute;top:16px;right:16px;z-index:201}
        .fs-toggle{position:absolute;bottom:8px;right:8px;z-index:5}
        .trend-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .pill{padding:7px 12px;background:var(--card2);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:600}
        .pill.loss{color:var(--success);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
        .pill.gain{color:var(--cal);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
        .pill.neutral{color:var(--text-dim)}
        .table-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .table-toolbar .spacer{flex:1}
        .table-toolbar .selected-count{font-size:13px;color:var(--text-dim);font-weight:600}
        .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border)}
        .data-table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card2)}
        .data-table th,.data-table td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border)}
        .data-table th{font-weight:700;color:var(--text-dim);text-transform:uppercase;font-size:10px;letter-spacing:.06em;background:var(--card);position:sticky;top:0;z-index:1}
        .data-table th:first-child,.data-table td:first-child{text-align:center;padding:12px 8px;width:40px}
        .data-table th:nth-child(2),.data-table td:nth-child(2){text-align:left}
        .data-table tr.selected{background:var(--accent-glow)}
        .data-table tr:hover{background:var(--card-hover)}
        .data-table tr:last-child td{border-bottom:none}
        .data-table td.dim{color:var(--text-dim)}
        .data-table td.editable-cell{cursor:pointer}
        .data-table td.editable-cell:hover{color:var(--accent)}
        .row-checkbox{width:20px;height:20px;cursor:pointer;accent-color:var(--accent)}
        .auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
        .auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
        .auth-card h1{font-size:32px;text-align:center;margin-bottom:8px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .auth-card .subtitle{text-align:center;color:var(--text-dim);margin-bottom:28px;font-size:14px}
        .auth-card input{margin-bottom:12px}
        .btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;min-height:52px;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-primary:active{transform:translateY(0)}
        .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .toggle-link{display:block;width:100%;text-align:center;margin-top:16px;color:var(--text-dim);background:none;border:none;font-size:14px;cursor:pointer;padding:10px;font-weight:600}
        .toggle-link:hover{color:var(--accent)}
        .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px;text-align:center;font-weight:600}
        .settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:16px}
        .settings-row:last-child{border-bottom:none}
        .settings-row .label{font-weight:600}
        .settings-row .desc{font-size:12px;color:var(--text-dim);margin-top:2px}
        .toggle{position:relative;width:52px;height:30px;background:var(--card2);border-radius:999px;cursor:pointer;transition:background .2s;border:1.5px solid var(--border);flex-shrink:0}
        .toggle.on{background:var(--accent);border-color:var(--accent)}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
        .toggle.on::after{transform:translateX(22px)}
        .axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
        .axis-grid input{padding:10px 12px;font-size:14px}
        .paste-area{margin-top:16px;padding:16px;background:var(--card2);border-radius:12px;border:1px solid var(--border)}
        .paste-area .help{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.5}
        .paste-area textarea{min-height:80px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;margin-bottom:8px}
        .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:4px 0}
        .collapse-header .chevron{transition:transform .2s;color:var(--text-dim);font-size:12px}
        .collapse-header.open .chevron{transform:rotate(90deg)}
        .sync-indicator{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;font-weight:600}
        .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
        .sync-dot.syncing{background:var(--maint);box-shadow:0 0 8px var(--maint);animation:pulse 1.2s infinite}
        .sync-dot.error{background:var(--danger);box-shadow:0 0 8px var(--danger)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal{background:var(--card);border-radius:20px;padding:24px;max-width:400px;width:100%;border:1px solid var(--border);box-shadow:var(--shadow-lg)}
        .modal h3{font-size:18px;margin-bottom:8px}
        .modal p{color:var(--text-dim);margin-bottom:20px;line-height:1.5}
        .modal-buttons{display:flex;gap:10px}
        .modal-buttons button{flex:1;min-height:48px}
        .btn-danger{background:var(--danger);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:14px}
        .btn-danger:hover{background:#dc2626}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
        .empty-state .emoji{font-size:36px;margin-bottom:12px}
        .empty-state .text{font-size:14px}
        .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:24px;padding:16px}
        .tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--card2);border-radius:12px;padding:4px;border:1px solid var(--border)}
        .tab-btn{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:transparent;color:var(--text-dim);transition:all .2s}
        .tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
        .targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .targets-grid .input-group{margin-bottom:0}
        .axis-grid input[type="date"]{min-height:42px}
        .axis-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
        .axis-grid-2 input{padding:10px 12px;font-size:14px;min-height:42px}
        .activity-summary{display:flex;gap:10px;padding:14px;background:var(--card2);border-radius:12px;margin-bottom:14px;border:1px solid var(--border)}
        .activity-summary > div{flex:1;text-align:center}
        .activity-summary .num{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
        .activity-summary .num.cal{color:var(--cal)}
        .activity-summary .num.macro{font-size:18px}
        .activity-summary .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:700}
        .activity-list{display:flex;flex-direction:column;gap:8px}
        .activity-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);border-radius:12px;border:1px solid var(--border);border-left-width:3px}
        .activity-row.cal{border-left-color:var(--cal)}
        .activity-row.weight{border-left-color:var(--weight)}
        .activity-row .time{font-size:11px;color:var(--text-dim);font-weight:700;min-width:64px;text-transform:uppercase;letter-spacing:.04em}
        .activity-row .content{flex:1;min-width:0}
        .activity-row .label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
        .activity-row .val{font-size:15px;font-weight:800;letter-spacing:-.01em}
        .activity-row.cal .val{color:var(--cal)}
        .activity-row.weight .val{color:var(--weight)}
        .activity-row .macros{font-size:11px;color:var(--text-dim);margin-top:3px;font-weight:600}
        .activity-row .row-actions{display:flex;gap:6px;flex-shrink:0}
        .activity-row .row-actions button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;min-height:40px;min-width:40px;transition:all .15s}
        .activity-row .row-actions button.edit:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
        .activity-row .row-actions button.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
        .activity-empty{text-align:center;padding:48px 20px;color:var(--text-dim)}
        .activity-empty .emoji{font-size:36px;margin-bottom:10px}
        @media(max-width:480px){.container{padding:12px}.header{padding:14px 16px;border-radius:16px}.header h1{font-size:19px}.card{padding:16px;border-radius:16px}.battery-stats .total{font-size:22px}.data-table th,.data-table td{padding:10px 8px;font-size:13px}.targets-grid{grid-template-columns:1fr}.activity-row .time{min-width:56px}}
    </style>
</head>

// ============ FIREBASE REST API ============
async function firebaseSignUp(e,p){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    return{uid:d.localId,email:d.email,token:d.idToken,refreshToken:d.refreshToken};
}
async function firebaseSignIn(e,p){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_CONFIG.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    return{uid:d.localId,email:d.email,token:d.idToken,refreshToken:d.refreshToken};
}
async function refreshIdToken(){
    const rt=localStorage.getItem('refreshToken');if(!rt)return false;
    try{
        const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grant_type:'refresh_token',refresh_token:rt})});
        const d=await r.json();if(d.error)return false;
        state.token=d.id_token;localStorage.setItem('token',d.id_token);
        if(d.refresh_token)localStorage.setItem('refreshToken',d.refresh_token);
        return true;
    }catch(e){return false;}
}
async function fsGet(uid,tok,doc){
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/users/${uid}/data/${doc}`,{headers:{'Authorization':`Bearer ${tok}`}});
    if(r.status===401||r.status===403)throw new Error('AUTH_EXPIRED');
    if(r.status===404)return null;if(!r.ok)return null;return await r.json();
}
async function fsSet(uid,tok,doc,fields){
    let r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/users/${uid}/data?documentId=${doc}`,{method:'POST',headers:{'Authorization':`Bearer ${tok}`,'Content-Type':'application/json'},body:JSON.stringify({fields})});
    if(!r.ok){r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/users/${uid}/data/${doc}`,{method:'PATCH',headers:{'Authorization':`Bearer ${tok}`,'Content-Type':'application/json'},body:JSON.stringify({fields})});}
    return r.ok;
}

function localEntriesKey(){return state.user?'entries_'+state.user.uid:null;}
function backupEntriesLocal(){
    const k=localEntriesKey();if(!k)return;
    try{localStorage.setItem(k,JSON.stringify(state.entries));}catch(e){}
}
function readEntriesLocal(){
    const k=localEntriesKey();if(!k)return [];
    try{const v=localStorage.getItem(k);return v?JSON.parse(v)||[]:[];}catch(e){return [];}
}

async function loadUserData(){
    if(!state.user||!state.token)return;setSync('syncing');
    const localEntries=readEntriesLocal();
    const doLoad=async ()=>{
        let ed=await fsGet(state.user.uid,state.token,'entries');
        let cloudEntries=[];
        if(ed&&ed.fields&&ed.fields.data){
            try{cloudEntries=JSON.parse(ed.fields.data.stringValue)||[];}catch(e){cloudEntries=[];}
        }
        // Merge: cloud is canonical, but rescue any local-only entries (saves that never landed)
        const cloudIds=new Set(cloudEntries.map(e=>String(e.id)));
        const localOnly=localEntries.filter(e=>!cloudIds.has(String(e.id)));
        state.entries=[...cloudEntries,...localOnly];
        let md=await fsGet(state.user.uid,state.token,'settings');
        if(md&&md.fields){
            const f=md.fields;
            if(f.maintenance)state.maintenance=f.maintenance.stringValue||'';
            if(f.targetCal)state.targetCal=f.targetCal.stringValue||'';
            if(f.targetP)state.targetP=f.targetP.stringValue||'';
            if(f.targetF)state.targetF=f.targetF.stringValue||'';
            if(f.targetC)state.targetC=f.targetC.stringValue||'';
        }
        if(localOnly.length){
            // Push recovered entries up so cloud catches up
            await fsSet(state.user.uid,state.token,'entries',{data:{stringValue:JSON.stringify(state.entries)}});
        }
        backupEntriesLocal();
    };
    try{
        await doLoad();
        setSync('synced');renderApp();
    }catch(e){
        console.error('Load error:',e);
        const ok=await refreshIdToken();
        if(ok){
            try{
                await doLoad();
                setSync('synced');renderApp();
            }catch(e2){
                // Cloud unreachable - keep local data so user doesn't lose work
                state.entries=localEntries;setSync('error');renderApp();
            }
        }else{
            // Auth refresh failed entirely - sign out
            setSync('error');clearUserState();renderApp();
        }
    }
}

let _saveInFlight=false,_saveScheduled=false;
async function saveEntries(){
    backupEntriesLocal();
    if(!state.user||!state.token)return;
    if(_saveInFlight){_saveScheduled=true;return;}
    _saveInFlight=true;setSync('syncing');
    try{
        let ok=await fsSet(state.user.uid,state.token,'entries',{data:{stringValue:JSON.stringify(state.entries)}});
        if(!ok){
            const refreshed=await refreshIdToken();
            if(refreshed){
                ok=await fsSet(state.user.uid,state.token,'entries',{data:{stringValue:JSON.stringify(state.entries)}});
            }
        }
        setSync(ok?'synced':'error');
    }catch(e){setSync('error');}
    finally{
        _saveInFlight=false;
        if(_saveScheduled){_saveScheduled=false;saveEntries();}
    }
}
async function saveSettings(){
    if(!state.user||!state.token)return;setSync('syncing');
    const fields={maintenance:{stringValue:state.maintenance},targetCal:{stringValue:state.targetCal},targetP:{stringValue:state.targetP},targetF:{stringValue:state.targetF},targetC:{stringValue:state.targetC}};
    try{
        let ok=await fsSet(state.user.uid,state.token,'settings',fields);
        if(!ok){
            const refreshed=await refreshIdToken();
            if(refreshed){ok=await fsSet(state.user.uid,state.token,'settings',fields);}
        }
        setSync(ok?'synced':'error');
    }catch(e){setSync('error');}
}
function setSync(s){state.syncStatus=s;const d=document.querySelector('.sync-dot'),t=document.querySelector('.sync-text');if(d&&t){d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');t.textContent=s==='syncing'?'Syncing':s==='error'?'Error':'Synced';}}

function findFood(q){
    if(!q||q.length<2)return null;q=q.toLowerCase().trim();
    if(FOOD_DB[q])return{name:q,...FOOD_DB[q]};
    let best=null,bestLen=0;
    for(const[n,info]of Object.entries(FOOD_DB)){
        if((q.includes(n)||n.includes(q))&&n.length>bestLen){best={name:n,...info};bestLen=n.length;}
    }
    return best;
}
function scaleFood(food,newGrams){
    if(!food||!food.grams||!newGrams)return food;
    const ratio=newGrams/food.grams;
    return{...food,cal:Math.round(food.cal*ratio),p:+(food.p*ratio).toFixed(1),f:+(food.f*ratio).toFixed(1),c:+(food.c*ratio).toFixed(1),grams:newGrams,serving:`${newGrams}g`};
}

// ============ DATA ============
function getDateMap(){const m={};state.entries.forEach(e=>{if(!m[e.date])m[e.date]={calories:[],weights:[]};if(e.type==='calorie')m[e.date].calories.push(e);else if(e.type==='weight')m[e.date].weights.push(e);});return m;}

function getChartData(){
    const map=getDateMap(),dates=Object.keys(map).sort();
    if(!dates.length)return{dates:[],calories:[],weights:[],cal7day:[],weight7day:[],maintenance:[]};
    const data=dates.map(d=>{const it=map[d];return{date:d,totalCal:it.calories.reduce((s,e)=>s+e.value,0),weight:it.weights.length?it.weights[it.weights.length-1].value:null};});
    const today=todayLocal();
    const result=data.map((item,idx)=>{
        const isToday=item.date===today;
        const wEnd=isToday?idx:idx+1,wStart=isToday?Math.max(0,idx-7):Math.max(0,idx-6);
        const sl=data.slice(wStart,wEnd);
        const cv=sl.filter(d=>d.totalCal>0),wv=sl.filter(d=>d.weight!==null);
        return{...item,cal7day:cv.length?cv.reduce((s,d)=>s+d.totalCal,0)/cv.length:null,weight7day:wv.length?wv.reduce((s,d)=>s+d.weight,0)/wv.length:null};
    });
    return{dates:result.map(d=>d.date),calories:result.map(d=>d.totalCal||0),weights:result.map(d=>d.weight),cal7day:result.map(d=>d.cal7day),weight7day:result.map(d=>d.weight7day),maintenance:result.map(()=>state.maintenance?parseFloat(state.maintenance):null)};
}

function getWeightTrend(){
    const w=state.entries.filter(e=>e.type==='weight').sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(w.length<2)return null;const days=(new Date(w[w.length-1].date)-new Date(w[0].date))/(864e5);
    if(!days)return null;return((w[w.length-1].value-w[0].value)/days)*7;
}

function getTodayStats(){
    const t=state.entries.filter(e=>e.date===state.currentDate);
    const totalCal=t.filter(e=>e.type==='calorie').reduce((s,e)=>s+e.value,0);
    const totalP=t.filter(e=>e.type==='calorie').reduce((s,e)=>s+(e.protein||0),0);
    const totalF=t.filter(e=>e.type==='calorie').reduce((s,e)=>s+(e.fat||0),0);
    const totalC=t.filter(e=>e.type==='calorie').reduce((s,e)=>s+(e.carbs||0),0);
    const maint=state.maintenance?parseFloat(state.maintenance):0;
    const tgt=state.targetCal?parseFloat(state.targetCal):0;
    return{totalCal,totalP,totalF,totalC,maintenance:maint,targetCal:tgt,remaining:maint-totalCal,percentage:maint>0?(totalCal/maint)*100:0,targetPct:tgt>0?(totalCal/tgt)*100:0};
}

function humanizeError(m){const map={'EMAIL_EXISTS':'Email already registered.','INVALID_LOGIN_CREDENTIALS':'Invalid email or password.','INVALID_EMAIL':'Invalid email.','WEAK_PASSWORD':'Password must be 6+ chars.','TOO_MANY_ATTEMPTS_TRY_LATER':'Too many attempts.'};for(const k in map)if(m.includes(k))return map[k];return m.toLowerCase().replace(/_/g,' ');}

function renderChart(container){

    if(!canvas)return;
    let data=getChartData();
    if(!data.dates.length){canvas.parentElement.innerHTML='<div class="empty-state"><div class="emoji">📊</div><div class="text">Add data to see your chart</div></div>';return;}
    const dMin=state.axisDateMin,dMax=state.axisDateMax;
    if(dMin||dMax){
        const ndates=[],ncal=[],nw=[],ncal7=[],nw7=[],nm=[];
        data.dates.forEach((d,i)=>{
            if(dMin&&d<dMin)return;
            if(dMax&&d>dMax)return;
            ndates.push(d);ncal.push(data.calories[i]);nw.push(data.weights[i]);
            ncal7.push(data.cal7day[i]);nw7.push(data.weight7day[i]);nm.push(data.maintenance[i]);
        });
        data={dates:ndates,calories:ncal,weights:nw,cal7day:ncal7,weight7day:nw7,maintenance:nm};
    }
    if(!data.dates.length){canvas.parentElement.innerHTML='<div class="empty-state"><div class="emoji">📊</div><div class="text">No data in selected date range</div></div>';return;}
    if(state.chart)state.chart.destroy();

    const tc=isDark?'#94a3b8':'#64748b';
    const ds=[];

    ds.push({type:'line',label:'Weight',data:data.weights,borderColor:'rgba(16,185,129,1)',backgroundColor:'rgba(16,185,129,1)',borderWidth:0,pointRadius:5,pointHoverRadius:7,pointHitRadius:14,showLine:false,yAxisID:'yWeight',spanGaps:true,order:1});
    ds.push({type:'line',label:'Wt 7d avg',data:data.weight7day,borderColor:'rgba(139,92,246,1)',backgroundColor:'transparent',borderWidth:2.5,pointRadius:0,pointHitRadius:14,borderDash:[6,4],yAxisID:'yWeight',spanGaps:true,tension:.3,order:0});
    const wp=data.weights.map((w,i)=>w!==null?{x:i,y:w}:null).filter(p=>p);
    if(wp.length>=2){const n=wp.length,sx=wp.reduce((s,p)=>s+p.x,0),sy=wp.reduce((s,p)=>s+p.y,0),sxy=wp.reduce((s,p)=>s+p.x*p.y,0),sx2=wp.reduce((s,p)=>s+p.x*p.x,0),sl=(n*sxy-sx*sy)/(n*sx2-sx*sx),int=(sy-sl*sx)/n;ds.push({type:'line',label:'Trend',data:data.dates.map((_,i)=>sl*i+int),borderColor:'rgba(6,182,212,.9)',backgroundColor:'transparent',borderWidth:2,pointRadius:0,pointHitRadius:14,yAxisID:'yWeight',order:0});}
    const calMax=Math.max(...data.calories,state.maintenance?parseFloat(state.maintenance):0)*1.15;

    const wMin=vw.length?Math.floor(Math.min(...vw)-3):140,wMax=vw.length?Math.ceil(Math.max(...vw)+3):200;

// ============ EVENT BINDING ============
function bindAuth(){
    const s=document.getElementById('authSubmit'),t=document.getElementById('authToggle'),e=document.getElementById('authEmail'),p=document.getElementById('authPassword');
    s.onclick=()=>{const em=e.value.trim(),pw=p.value;if(!em||!pw){state.authError='Email and password required';renderApp();return;}handleAuth(em,pw);};
    t.onclick=()=>{state.authMode=state.authMode==='login'?'signup':'login';state.authError='';renderApp();};
    p.onkeydown=ev=>{if(ev.key==='Enter')s.click();};
    e.onkeydown=ev=>{if(ev.key==='Enter')p.focus();};
}

function bindTrackerEvents(){
    const di=document.getElementById('dateInput');
    if(di)di.onchange=e=>{state.currentDate=e.target.value;renderApp();};

    const ci=document.getElementById('calorieInput');
    if(ci){
        ci.oninput=e=>{
            state.calorieInput=e.target.value;
            if(!isNaN(parseFloat(e.target.value))&&/^\d+\.?\d*$/.test(e.target.value.trim())){state.suggestion=null;}
            else{const f=findFood(e.target.value);state.suggestion=f;state.suggestionGrams='';}
            const sb=document.querySelector('.suggestion-box');
            // Don't replace suggestion box if user is typing in override fields
            const activeEl=document.activeElement;
            const inOverride=activeEl&&(activeEl.id==='overrideGrams'||activeEl.id==='overrideCal');
            if(inOverride)return;
            if(state.suggestion){
                if(sb)sb.outerHTML=renderSuggestion();else ci.parentElement.insertAdjacentHTML('afterend',renderSuggestion());
                bindOverrideInputs();
            }else if(sb)sb.remove();
        };
        ci.onkeydown=e=>{
            if(e.key==='Enter'){e.preventDefault();
                // Enter just accepts suggestion if present, doesn't submit
                if(state.suggestion){W.acceptSuggestion();}
            }
        };
    }

    const wi=document.getElementById('weightInput');
    if(wi){wi.oninput=e=>{state.weightInput=e.target.value;};}
    // Macro inputs - auto-calc calories
    ['proteinInput','fatInput','carbInput'].forEach(id=>{
        const el=document.getElementById(id);
        if(el){
            el.oninput=e=>{
                state[id]=e.target.value;
                // Update calorie preview
                const macros=getMacroInputs();
                const cal=macros.p*4+macros.f*9+macros.c*4;
                const preview=document.querySelector('.macro-cal-preview');
                if(preview){
                    if(macros.p||macros.f||macros.c){
                        preview.innerHTML=`= <strong style="color:var(--text)">${Math.round(cal)} kcal</strong> from macros`;
                        preview.style.display='block';
                    }else{preview.style.display='none';}
                }
            };
        }
    });

    bindOverrideInputs();
}

function bindSettingsAxisInputs(){
    ['axisCalMin','axisCalMax','axisWeightMin','axisWeightMax','axisDateMin','axisDateMax'].forEach(id=>{
        const el=document.getElementById(id);
        if(el&&!el._bound){
            el._bound=true;
            el.onchange=e=>{state[id]=e.target.value;saveAxisPrefs();renderApp();};
        }
    });
}

function bindActivityEvents(){
    const di=document.getElementById('activityDateInput');
    if(di)di.onchange=e=>{state.currentDate=e.target.value;renderApp();};
}

function bindOverrideInputs(){
    const og=document.getElementById('overrideGrams');
    const oc=document.getElementById('overrideCal');
    if(og&&!og._bound){
        og._bound=true;
        og.addEventListener('input',e=>{
            state.suggestionGrams=e.target.value;
            const v=parseFloat(e.target.value);
            if(state.suggestion&&v>0){
                const orig=findFood(state.suggestion.name);
                if(orig){
                    state.suggestion=scaleFood(orig,v);
                    const nameEl=document.querySelector('.suggestion-info .name');
                    const servingEls=document.querySelectorAll('.suggestion-info .serving');
                    const calEl=document.querySelector('.suggestion-info .cal');
                    if(nameEl)nameEl.textContent=state.suggestion.name;
                    if(calEl)calEl.textContent=state.suggestion.cal+' kcal';
                    if(servingEls[0])servingEls[0].textContent=state.suggestion.serving+' ('+state.suggestion.grams+'g)';
                    if(servingEls[1])servingEls[1].textContent='P:'+state.suggestion.p+'g · F:'+state.suggestion.f+'g · C:'+state.suggestion.c+'g';
                }
            }
        });
    }
    if(oc&&!oc._bound){
        oc._bound=true;
        oc.addEventListener('input',e=>{state.overrideInput=e.target.value;});
    }
}
function getMacroInputs(){
    return{p:parseFloat(state.proteinInput)||0,f:parseFloat(state.fatInput)||0,c:parseFloat(state.carbInput)||0};
}

function clearInputs(){
    state.calorieInput='';state.suggestion=null;state.overrideInput='';state.suggestionGrams='';
    state.suggestionName='';
    state.proteinInput='';state.fatInput='';state.carbInput='';
}

// ============ WINDOW HANDLERS ============
const W={};
W.toggleSettings=()=>{state.showSettings=!state.showSettings;renderApp();};
W.toggleDataTable=()=>{state.showDataTable=!state.showDataTable;renderApp();};
W.logout=()=>logout();
W.toggleTheme=()=>setTheme(state.theme==='dark'?'light':'dark');
W.toggleAxisManual=()=>{state.axisAuto=!state.axisAuto;saveAxisPrefs();renderApp();};
W.clearDateRange=()=>{state.axisDateMin='';state.axisDateMax='';saveAxisPrefs();renderApp();};
W.setTab=t=>{state.currentTab=t;renderApp();if(t==='targets')bindTargetEvents();};
W.toggleMacroMode=()=>{state.macroMode=!state.macroMode;localStorage.setItem('macroMode',state.macroMode);renderApp();};
W.acceptSuggestion=()=>{
    if(state.suggestion){
        // Stage the value - don't submit. User hits + to record.
        const s=state.suggestion;
        state.calorieInput=String(s.cal);
        state.overrideInput='';
        state.suggestionName=s.name;
        // Auto-fill macros if macro mode is on
        if(state.macroMode){
            state.proteinInput=s.p?String(s.p):'';
            state.fatInput=s.f?String(s.f):'';
            state.carbInput=s.c?String(s.c):'';
        }
        state.suggestion=null;
        renderApp();
    }
};
W.declineSuggestion=()=>{state.suggestion=null;const sb=document.querySelector('.suggestion-box');if(sb)sb.remove();};
W.changeGrams=v=>{
    state.suggestionGrams=v;
    if(state.suggestion&&v){
        const orig=findFood(state.suggestion.name);
        if(orig){
            state.suggestion=scaleFood(orig,parseFloat(v));
            // Update display text without replacing the input (keeps keyboard open)
            const nameEl=document.querySelector('.suggestion-info .name');
            const servingEls=document.querySelectorAll('.suggestion-info .serving');
            const calEl=document.querySelector('.suggestion-info .cal');
            if(nameEl)nameEl.textContent=state.suggestion.name;
            if(calEl)calEl.textContent=state.suggestion.cal+' kcal';
            if(servingEls[0])servingEls[0].textContent=state.suggestion.serving+' ('+state.suggestion.grams+'g)';
            if(servingEls[1])servingEls[1].textContent='P:'+state.suggestion.p+'g · F:'+state.suggestion.f+'g · C:'+state.suggestion.c+'g';
        }
    }
};
W.submitCalorie=()=>{
    // Override takes priority if filled
    const override=(state.overrideInput||'').trim();
    const v=(state.calorieInput||'').trim();
    const macros=getMacroInputs();
    const m=macros.p||macros.f||macros.c?macros:null;
    const stagedName=state.suggestionName||null;

    if(override&&!isNaN(parseFloat(override))){
        addEntry('calorie',override,m,stagedName);clearInputs();
    }else if(!isNaN(parseFloat(v))&&/^\d+\.?\d*$/.test(v)){
        addEntry('calorie',v,m,stagedName);clearInputs();
    }else if(state.suggestion){
        const s=state.suggestion;
        addEntry('calorie',s.cal,{p:s.p||0,f:s.f||0,c:s.c||0},s.name);clearInputs();
    }
    renderApp();
};
W.submitWeight=()=>{const i=document.getElementById('weightInput');if(!i||!i.value)return;addEntry('weight',i.value);state.weightInput='';renderApp();};
W.submitMacros=()=>{
    const macros=getMacroInputs();
    if(!macros.p&&!macros.f&&!macros.c)return;
    const cal=macros.p*4+macros.f*9+macros.c*4;
    addEntry('calorie',cal,macros);
    state.proteinInput='';state.fatInput='';state.carbInput='';
    renderApp();
};
W.saveTargets=async ()=>{
    state.maintenance=document.getElementById('tgtMaint')?.value||'';
    state.targetCal=document.getElementById('tgtCal')?.value||'';
    state.targetP=document.getElementById('tgtP')?.value||'';
    state.targetF=document.getElementById('tgtF')?.value||'';
    state.targetC=document.getElementById('tgtC')?.value||'';
    await saveSettings();
    const ind=document.getElementById('savedIndicator');
    if(ind){
        ind.textContent='✓ Saved';
        ind.style.opacity='1';
        setTimeout(()=>{ind.style.opacity='0';},2500);
    }
};

W.toggleSelectAll=()=>{
    const all=state.entries.map(e=>e.id);
    const allSel=all.length>0&&all.every(id=>state.selectedIds.has(id));
    if(allSel)state.selectedIds.clear();else all.forEach(id=>state.selectedIds.add(id));
    renderApp();
};
W.toggleDateSel=date=>{
    const map=getDateMap();const items=map[date]?[...map[date].calories,...map[date].weights]:[];
    const allSel=items.length>0&&items.every(x=>state.selectedIds.has(x.id));
    if(allSel)items.forEach(x=>state.selectedIds.delete(x.id));else items.forEach(x=>state.selectedIds.add(x.id));
    renderApp();
};
W.confirmDeleteSelected=()=>{const c=state.selectedIds.size;if(!c)return;state.modal={title:`Delete ${c} entries?`,message:'This cannot be undone.',confirmText:'Delete',action:'doDeleteSelected'};renderApp();};
W.confirmDeleteAll=()=>{if(!state.entries.length)return;state.modal={title:'Clear all data?',message:`Delete all ${state.entries.length} entries permanently?`,confirmText:'Delete All',action:'doDeleteAll'};renderApp();};
W.doDeleteSelected=()=>deleteSelected();
W.doDeleteAll=()=>deleteAll();
W.closeModal=()=>{state.modal=null;renderApp();};

W.editCal=(date)=>{
    const map=getDateMap();const items=map[date]?map[date].calories:[];if(!items.length)return;
    const total=items.reduce((s,e)=>s+e.value,0);
    const nv=prompt(`Edit calories for ${formatDate(date)}:`,Math.round(total));
    if(nv===null)return;const v=parseFloat(nv);if(isNaN(v))return;
    pushHistory();
    state.entries=state.entries.filter(e=>!(e.date===date&&e.type==='calorie'));
    state.entries.push({id:Date.now()+Math.random(),date,type:'calorie',value:v,time:Date.now()});
    saveEntries();renderApp();
};
W.editWt=(date)=>{
    const map=getDateMap();const items=map[date]?map[date].weights:[];if(!items.length)return;
    const last=items[items.length-1].value;
    const nv=prompt(`Edit weight for ${formatDate(date)}:`,last.toFixed(1));
    if(nv===null)return;const v=parseFloat(nv);if(isNaN(v))return;
    pushHistory();
    state.entries=state.entries.filter(e=>!(e.date===date&&e.type==='weight'));
    state.entries.push({id:Date.now()+Math.random(),date,type:'weight',value:v,time:Date.now()});
    saveEntries();renderApp();
};

W.undo=()=>{
    if(!state.history.length)return;
    state.entries=JSON.parse(state.history.pop());
    state.selectedIds.clear();
    saveEntries();renderApp();
};

W.deleteEntry=(idStr)=>{
    const idx=state.entries.findIndex(e=>String(e.id)===idStr);
    if(idx<0)return;
    pushHistory();
    state.entries.splice(idx,1);
    saveEntries();renderApp();
};
W.editEntry=(idStr)=>{
    const e=state.entries.find(x=>String(x.id)===idStr);
    if(!e)return;
    if(e.type==='weight'){
        const nv=prompt('Edit weight (lbs):',e.value.toFixed(1));
        if(nv===null)return;const v=parseFloat(nv);if(isNaN(v))return;
        pushHistory();e.value=v;saveEntries();renderApp();
        return;
    }
    const nv=prompt('Edit calories:',Math.round(e.value));
    if(nv===null)return;const v=parseFloat(nv);if(isNaN(v))return;
    pushHistory();
    if(e.protein||e.fat||e.carbs){
        // Scale macros proportionally so they stay consistent
        const ratio=e.value>0?v/e.value:0;
        e.protein=+(((e.protein||0)*ratio).toFixed(1));
        e.fat=+(((e.fat||0)*ratio).toFixed(1));
        e.carbs=+(((e.carbs||0)*ratio).toFixed(1));
    }
    e.value=v;saveEntries();renderApp();
};

W.importPaste=()=>{
    const ta=document.getElementById('pasteArea');if(!ta)return;
    const lines=ta.value.split('\n').filter(l=>l.trim());const ne=[];
    lines.forEach(line=>{const p=line.split(/[\t,|]/).map(x=>x.trim());if(p.length<2)return;
        const date=p[0],cal=parseFloat(p[1]),wt=p[2]?parseFloat(p[2]):null;
        if(!isNaN(cal)&&cal>0)ne.push({id:Date.now()+Math.random(),date,type:'calorie',value:cal,time:Date.now()});
        if(wt&&!isNaN(wt))ne.push({id:Date.now()+Math.random(),date,type:'weight',value:wt,time:Date.now()});
    });
    if(ne.length){pushHistory();state.entries.push(...ne);saveEntries();renderApp();alert(`Imported ${ne.length} entries`);}
    else alert('No valid entries found.');
};

function bindTargetEvents(){
    // Target inputs are simple - just save on button click
}

// Make W global
Object.keys(W).forEach(k=>{window[k]=W[k];});
// Also expose as window.W for onclick handlers
window.W=W;

// ============ INIT ============
async function init(){
    document.body.className='theme-'+state.theme;
    const su=localStorage.getItem('user'),st=localStorage.getItem('token');
    if(su&&st){
        state.user=JSON.parse(su);state.token=st;
        const ok=await refreshIdToken();
        if(ok){
            try{await loadUserData();}catch(e){console.error('Init load error:',e);clearUserState();}
        }else{
            // Token refresh failed - force re-login
            clearUserState();
        }
    }
    renderApp();
}
init();
    </script>
</body>
